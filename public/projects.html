<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05070e"><title>IVA · Projekte</title><style>
:root{--bg:#05070e;--side:#081226;--panel:#0e1a33;--line:rgba(102,145,220,.25);--text:#eff5ff;--muted:#8da2c2;--cyan:#22e6d6;--blue:#559cff;--green:#67e0a6;--yellow:#ffc76b;--red:#ff8585;--r:17px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 650px at 90% 0,rgba(34,230,214,.1),transparent 64%),var(--bg);color:var(--text);font:14px/1.46 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:20px 17px;background:rgba(7,16,33,.96);border-right:1px solid var(--line)}a{color:var(--muted);text-decoration:none}.brand{display:flex;gap:10px;align-items:center;margin:18px 0}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121c;font-weight:900}.brand b,.brand small{display:block}.brand small,.muted{color:var(--muted)}input,button{font:inherit;color:inherit}.token{border:1px solid var(--line);border-radius:12px;padding:11px;background:#071024;margin-bottom:12px}.token input{width:100%;border:1px solid var(--line);background:#050c19;border-radius:8px;padding:8px;margin:7px 0}.token button,.project-btn{width:100%;border:1px solid var(--line);background:#11213f;border-radius:9px;padding:9px;cursor:pointer}.project-btn{text-align:left;margin-top:7px}.project-btn.active,.project-btn:hover{border-color:var(--cyan)}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);font-weight:850}h1{font-size:34px;margin:4px 0}h2{font-size:19px;margin:0 0 5px}.status{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);height:max-content}.status.on{color:var(--green)}.card,.hero,.item,.automation{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(165deg,rgba(18,34,65,.95),rgba(9,18,36,.94))}.hero,.card{padding:19px;margin-top:13px}.hero h2{font-size:23px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.metric{border:1px solid rgba(102,145,220,.18);border-radius:11px;padding:10px;background:rgba(3,9,21,.34)}.metric b,.metric small{display:block}.metric b{font-size:24px}.metric small{color:var(--muted)}.automation-grid,.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.automation,.item{padding:13px;background:rgba(3,9,21,.34)}.head{display:flex;justify-content:space-between;gap:10px}.head h3{margin:0;font-size:15px}.badge{border-radius:999px;padding:3px 7px;font-size:9px;text-transform:uppercase;background:rgba(255,199,107,.12);color:var(--yellow);height:max-content;white-space:nowrap}.badge.active,.badge.complete{color:var(--green);background:rgba(103,224,166,.12)}.badge.prepared,.badge.foundation{color:#8cc2ff;background:rgba(85,156,255,.14)}.automation p,.item p{color:var(--muted)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta div{border:1px solid rgba(102,145,220,.14);border-radius:8px;padding:7px}.meta span,.meta b{display:block}.meta span{font-size:9px;color:var(--muted);text-transform:uppercase}.rule,.next{border-top:1px solid rgba(102,145,220,.15);margin-top:8px;padding-top:8px;font-size:11px}.rule{color:#f1d9a8}.next{color:#cde1ff}.road{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;border:1px solid rgba(102,145,220,.17);border-radius:11px;padding:9px;margin-top:7px}.road strong{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121c}.road b,.road small{display:block}.road small{color:var(--muted)}.iva{position:fixed;right:17px;bottom:17px;width:62px;height:66px;border:1px solid rgba(34,230,214,.36);border-radius:21px;background:#142642;color:var(--cyan);font-weight:900;cursor:pointer}@media(max-width:900px){.app{display:block}.side{border:0;bord
