<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05070e">
  <title>IVA · Projekte</title>
  <style>
    :root{--bg:#05070e;--side:#081226;--panel:#0e1a33;--line:rgba(102,145,220,.25);--text:#eff5ff;--muted:#8da2c2;--cyan:#22e6d6;--blue:#559cff;--green:#67e0a6;--yellow:#ffc76b;--red:#ff8585;--r:17px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 650px at 90% 0,rgba(34,230,214,.1),transparent 64%),var(--bg);color:var(--text);font:14px/1.46 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.side{padding:20px 17px;background:rgba(7,16,33,.96);border-right:1px solid var(--line)}a{color:var(--muted);text-decoration:none}.brand{display:flex;gap:10px;align-items:center;margin:18px 0}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121c;font-weight:900}.brand b,.brand small{display:block}.brand small,.muted{color:var(--muted)}input,textarea,select,button{font:inherit;color:inherit}input,textarea,select{width:100%;border:1px solid var(--line);background:#050c19;border-radius:10px;padding:10px}textarea{resize:vertical;min-height:88px}.token{border:1px solid var(--line);border-radius:12px;padding:11px;background:#071024;margin-bottom:12px}.token input{margin:7px 0}.btn,.token button{border:1px solid var(--line);background:#11213f;border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover,.token button:hover{border-color:var(--cyan)}.btn.primary{background:linear-gradient(135deg,#177d8b,#2363a5);border-color:rgba(34,230,214,.55);font-weight:750}.btn.danger{color:#ffd2d2;border-color:rgba(255,133,133,.4)}.new-project{width:100%;margin-bottom:9px;padding:11px}.project-row{display:grid;grid-template-columns:1fr 36px;gap:6px;margin-top:7px}.project-main,.project-trash{border:1px solid var(--line);background:#11213f;border-radius:9px;cursor:pointer}.project-main{text-align:left;padding:9px}.project-main.active,.project-main:hover,.project-trash:hover{border-color:var(--cyan)}.project-main b,.project-main small{display:block}.project-trash{color:#ffadad;font-size:16px}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan);font-weight:850}h1{font-size:34px;margin:4px 0}h2{font-size:19px;margin:0 0 5px}h3{margin:0}.status{border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);height:max-content}.status.on{color:var(--green)}.card,.hero,.item,.automation{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(165deg,rgba(18,34,65,.95),rgba(9,18,36,.94))}.hero,.card{padding:19px;margin-top:13px}.hero h2{font-size:23px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.note-compose{display:grid;grid-template-columns:1fr auto;align-items:end;gap:9px;margin-top:13px}.note-list{display:grid;gap:8px;margin-top:12px}.note{border:1px solid rgba(102,145,220,.17);background:rgba(3,9,21,.34);border-radius:11px;padding:11px}.note p{white-space:pre-wrap;margin:0 0 6px}.note small{color:var(--muted)}.archive-layout{display:grid;grid-template-columns:240px 1fr;gap:12px;margin-top:13px}.folders{border:1px solid rgba(102,145,220,.18);border-radius:12px;padding:9px;background:rgba(3,9,21,.3);min-width:0}.folder-btn{width:100%;display:flex;gap:7px;align-items:center;border:0;background:transparent;border-radius:8px;padding:8px;text-align:left;cursor:pointer}.folder-btn:hover,.folder-btn.active{background:rgba(85,156,255,.15);color:#dffcff}.folder-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.files-panel{min-width:0}.dropzone{border:1px dashed rgba(34,230,214,.5);border-radius:13px;padding:22px;text-align:center;background:rgba(34,230,214,.045);cursor:pointer}.dropzone.drag{background:rgba(34,230,214,.13);border-color:var(--cyan)}.dropzone b,.dropzone small{display:block}.dropzone small{color:var(--muted);margin-top:4px}.upload-status{min-height:20px;color:var(--muted);margin:7px 0}.file-list{display:grid;gap:7px}.file{display:grid;grid-template-columns:37px 1fr auto;gap:9px;align-items:center;border:1px solid rgba(102,145,220,.18);border-radius:11px;padding:9px;background:rgba(3,9,21,.3)}.file-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:#142b4c;color:var(--cyan)}.file b,.file small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file small{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.metric{border:1px solid rgba(102,145,220,.18);border-radius:11px;padding:10px;background:rgba(3,9,21,.34)}.metric b,.metric small{display:block}.metric b{font-size:24px}.metric small{color:var(--muted)}.automation-grid,.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.automation,.item{padding:13px;background:rgba(3,9,21,.34)}.head{display:flex;justify-content:space-between;gap:10px}.head h3{font-size:15px}.badge{border-radius:999px;padding:3px 7px;font-size:9px;text-transform:uppercase;background:rgba(255,199,107,.12);color:var(--yellow);height:max-content;white-space:nowrap}.badge.active,.badge.complete{color:var(--green);background:rgba(103,224,166,.12)}.badge.prepared,.badge.foundation{color:#8cc2ff;background:rgba(85,156,255,.14)}.automation p,.item p{color:var(--muted)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meta div{border:1px solid rgba(102,145,220,.14);border-radius:8px;padding:7px}.meta span,.meta b{display:block}.meta span{font-size:9px;color:var(--muted);text-transform:uppercase}.rule,.next{border-top:1px solid rgba(102,145,220,.15);margin-top:8px;padding-top:8px;font-size:11px}.rule{color:#f1d9a8}.next{color:#cde1ff}.road{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;border:1px solid rgba(102,145,220,.17);border-radius:11px;padding:9px;margin-top:7px}.road strong{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121c}.road b,.road small{display:block}.road small{color:var(--muted)}.empty{padding:50px 20px;text-align:center;color:var(--muted)}dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:18px;padding:0;background:#0d1930;color:var(--text);box-shadow:0 25px 80px #000}dialog::backdrop{background:rgba(1,4,10,.8)}.dialog-body{padding:20px}.dialog-body label{display:block;margin-top:12px;color:#cad8ec}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#101d35;box-shadow:0 10px 35px #000;z-index:20}.toast.error{color:#ffd0d0;border-color:rgba(255,133,133,.45)}.iva{position:fixed;right:17px;bottom:17px;width:62px;height:66px;border:1px solid rgba(34,230,214,.36);border-radius:21px;background:#142642;color:var(--cyan);font-weight:900;cursor:pointer}.project-disclosure{padding:0;overflow:hidden}.project-disclosure>summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;padding:17px 19px}.project-disclosure>summary::-webkit-details-marker{display:none}.project-disclosure>summary::before{content:'›';font-size:25px;color:var(--cyan);transition:transform .18s}.project-disclosure[open]>summary::before{transform:rotate(90deg)}.project-disclosure .summary-copy{flex:1}.project-disclosure .summary-copy h2{margin:0}.project-disclosure .disclosure-body{border-top:1px solid var(--line);padding:17px 19px}.automation-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.automation-details{margin-top:10px;border-top:1px solid rgba(102,145,220,.15);padding-top:8px}.automation-details summary{cursor:pointer;color:var(--muted)}.switch{position:relative;display:inline-block;width:48px;height:27px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:999px;background:#32405a;cursor:pointer;transition:.2s}.slider::before{content:'';position:absolute;width:21px;height:21px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:linear-gradient(135deg,#138f80,#2b7cc3)}.switch input:checked+.slider::before{transform:translateX(21px)}.switch input:disabled+.slider{opacity:.38;cursor:not-allowed}.hidden{display:none!important}@media(max-width:900px){.app{display:block}.side{border:0;border-bottom:1px solid var(--line)}.main{padding:17px 12px 88px}.automation-grid,.item-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.top{display:block}.status{display:inline-block;margin-top:10px}.archive-layout{grid-template-columns:1fr}.folders{max-height:240px;overflow:auto}.note-compose{grid-template-columns:1fr}.file{grid-template-columns:37px minmax(0,1fr) auto}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <a href="/cockpit">← Zurück zum Cockpit</a>
      <div class="brand"><div class="logo">IVA</div><div><b>Projekte</b><small>Projektakten · Notizen · Dokumente</small></div></div>
      <div class="token"><b>Verbindung</b><input id="token" type="password" placeholder="API-Token"><button id="saveToken">Speichern & verbinden</button></div>
      <button class="btn primary new-project" id="newProject">＋ Neues Projekt</button>
      <div id="projectList"></div>
    </aside>
    <main class="main">
      <header class="top"><div><div class="eyebrow" id="category">IVA · Projekt</div><h1 id="title">Projekte werden geladen …</h1><div class="muted" id="description"></div></div><div class="status" id="status">verbinde …</div></header>
      <div id="content"></div>
    </main>
  </div>
  <button class="iva" id="ivaHelper" aria-label="IVA öffnen">IVA</button>
  <input class="hidden" id="fileInput" type="file" multiple>
  <div class="toast hidden" id="toast"></div>

  <dialog id="projectDialog"><form class="dialog-body" id="projectForm"><div class="eyebrow">Neue Projektakte</div><h2>Projekt anlegen</h2><label>Name<input id="projectName" maxlength="180" required placeholder="z. B. Neue Vertriebsidee"></label><label>Bereich<input id="projectCategory" maxlength="220" placeholder="z. B. Vertrieb · Marketing"></label><label>Worum geht es?<textarea id="projectDescription" maxlength="4000" placeholder="Kurze Beschreibung oder Ziel des Projekts"></textarea></label><div class="dialog-actions"><button class="btn" type="button" data-close="projectDialog">Abbrechen</button><button class="btn primary" type="submit">Projekt anlegen</button></div></form></dialog>
  <dialog id="folderDialog"><form class="dialog-body" id="folderForm"><div class="eyebrow">Projektakte strukturieren</div><h2>Ordner anlegen</h2><div class="muted" id="folderParentHint"></div><label>Ordnername<input id="folderName" maxlength="180" required placeholder="z. B. Absprachen"></label><div class="dialog-actions"><button class="btn" type="button" data-close="folderDialog">Abbrechen</button><button class="btn primary" type="submit">Ordner anlegen</button></div></form></dialog>
  <script src="/projects.js"></script>
</body>
</html>
