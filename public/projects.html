  <style>
    .opportunity-origin{border-color:rgba(34,230,214,.38);background:linear-gradient(145deg,rgba(10,48,58,.92),rgba(8,20,42,.96))}
    .opportunity-score{display:grid;place-items:center;min-width:76px;height:46px;padding:0 12px;border:1px solid rgba(34,230,214,.45);border-radius:14px;color:var(--cyan);font-size:17px;font-weight:900;background:rgba(34,230,214,.08)}
    .origin-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.origin-facts>div,.origin-grid>div{padding:11px;border:1px solid rgba(102,145,220,.18);border-radius:11px;background:rgba(3,9,21,.3)}
    .origin-facts small,.origin-facts b{display:block}.origin-facts small,.origin-grid small{color:var(--muted)}.origin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.origin-grid p{margin:5px 0;color:#c7d6ea}.opportunity-origin>.btn{display:inline-block;margin-top:10px}
    @media(max-width:700px){.origin-facts,.origin-grid{grid-template-columns:1fr}.opportunity-score{min-width:68px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <a href="/cockpit">← Zurück zum Cockpit</a>
      <div class="brand"><div class="logo">IVA</div><div><b>Projekte</b><small>Projektakten · Notizen · Dokumente</small></div></div>
      <div class="token"><b>Verbindung</b><input id="token" type="password" placeholder="API-Token"><button id="saveToken">Speichern & verbinden</button></div>
      <button class="btn primary new-project" id="newProject">＋ Neues Projekt</button>
      <div id="projectList"></div>
    </aside>
    <main class="main">
      <header class="top"><div><div class="eyebrow" id="category">IVA · Projekt</div><h1 id="title">Projekte werden geladen …</h1><div class="muted" id="description"></div></div><div class="status" id="status">verbinde …</div></header>
      <div id="content"></div>
    </main>
  </div>
  <button class="iva" id="ivaHelper" aria-label="IVA öffnen">IVA</button>
  <input class="hidden" id="fileInput" type="file" multiple>
  <div class="toast hidden" id="toast"></div>

  <dialog id="projectDialog"><form class="dialog-body" id="projectForm"><div class="eyebrow">Neue Projektakte</div><h2>Projekt und Marke anlegen</h2><div class="form-grid"><label>Name<input id="projectName" maxlength="180" required placeholder="z. B. Goals & Concepts"></label><label>Bereich<input id="projectCategory" maxlength="220" placeholder="z. B. Beratung · Marketing"></label><label>Website<input id="projectWebsite" maxlength="1200" inputmode="url" placeholder="https://www.beispiel.de"></label><label>Instagram<input id="projectInstagram" maxlength="1200" placeholder="@profil oder Instagram-Link"></label><label class="full">Worum geht es?<textarea id="projectDescription" maxlength="4000" placeholder="Kurze Beschreibung oder Ziel des Projekts"></textarea></label><label class="full logo-picker">Logo hochladen<input id="projectLogo" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"><div class="logo-help">PNG, JPG oder WebP · maximal 5 MB · am besten quadratisch</div></label></div><div class="dialog-actions"><button class="btn" type="button" data-close="projectDialog">Abbrechen</button><button class="btn primary" type="submit">Projekt anlegen</button></div></form></dialog>
  <dialog id="brandDialog"><form class="dialog-body" id="brandForm"><div class="eyebrow">Schneller erkennen</div><h2>Markenprofil bearbeiten</h2><div class="form-grid"><label>Name<input id="brandName" maxlength="180" required></label><label>Bereich<input id="brandCategory" maxlength="220"></label><label>Website<input id="brandWebsite" maxlength="1200" inputmode="url" placeholder="https://www.beispiel.de"></label><label>Instagram<input id="brandInstagram" maxlength="1200" placeholder="@profil oder Instagram-Link"></label><label class="full">Kurzbeschreibung<textarea id="brandDescription" maxlength="5000"></textarea></label><label class="full logo-picker">Logo ersetzen<input id="brandLogo" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"><div class="logo-help">PNG, JPG oder WebP · maximal 5 MB · das Logo erscheint sofort links in der Projektliste.</div><button class="btn danger remove-logo" id="removeBrandLogo" type="button">Logo entfernen</button></label></div><div class="dialog-actions"><button class="btn" type="button" data-close="brandDialog">Abbrechen</button><button class="btn primary" type="submit">Markenprofil speichern</button></div></form></dialog>
  <dialog id="folderDialog"><form class="dialog-body" id="folderForm"><div class="eyebrow">Projektakte strukturieren</div><h2>Ordner anlegen</h2><div class="muted" id="folderParentHint"></div><label>Ordnername<input id="folderName" maxlength="180" required placeholder="z. B. Absprachen"></label><div class="dialog-actions"><button class="btn" type="button" data-close="folderDialog">Abbrechen</button><button class="btn primary" type="submit">Ordner anlegen</button></div></form></dialog>
  <script src="/projects.js"></script>
</body>
</html>
