<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05070e">
  <title>IVA · WhatsApp-Agenten</title>
  <style>
    :root{--bg:#05070e;--panel:#0d1730;--line:rgba(96,140,220,.24);--text:#eef3fb;--muted:#8aa0c0;--cyan:#22e6d6;--blue:#4f9dff;--danger:#ff7676}*{box-sizing:border-box}body{margin:0;background:radial-gradient(800px 500px at 100% 0,rgba(34,230,214,.1),transparent),var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.shell{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}.top h1{margin:3px 0;font-size:28px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--cyan);font-weight:800}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#101d38;color:var(--text);padding:10px 13px;border-radius:10px;cursor:pointer;text-decoration:none}.btn.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03131a;font-weight:800}.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(16,29,56,.92),rgba(11,20,39,.92));border:1px solid var(--line);border-radius:16px;padding:17px}.card h2{font-size:15px;margin:0 0 14px}.profile{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--text);padding:10px;border-radius:10px;cursor:pointer;margin:4px 0}.profile.active,.profile:hover{border-color:var(--line);background:rgba(79,157,255,.1)}.profile b,.profile small{display:block}.profile small{color:var(--muted)}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid var(--line);background:rgba(3,7,16,.66);color:var(--text);padding:10px;border-radius:10px;outline:none}textarea{min-height:92px;resize:vertical}.check{display:flex;gap:9px;align-items:center;color:var(--text);text-transform:none;letter-spacing:0}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.status{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px}.ok{color:var(--cyan)}.warn{color:#ffd27f}.test{margin-top:14px}.bubble{padding:11px 12px;border-radius:12px;margin:7px 0;white-space:pre-wrap}.bubble.user{background:rgba(79,157,255,.12);margin-left:12%}.bubble.bot{background:rgba(34,230,214,.09);margin-right:12%}.claim{border-top:1px solid var(--line);padding:9px 0}.claim:first-child{border-top:0}.badge{display:inline-flex;padding:2px 7px;border-radius:99px;background:rgba(34,230,214,.1);color:var(--cyan);font-size:10px;text-transform:uppercase}.danger{color:var(--danger)}@media(max-width:800px){.shell{padding:14px}.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div><div class="eyebrow">IVA · Vertrieb & Kundenservice</div><h1>WhatsApp-Agenten</h1><div class="muted">Flexible Kampagnen-Bots, sicherer Vertragsservice und Schadenaufnahme.</div></div><a class="btn" href="/cockpit">← Cockpit</a></div>
  <div class="status"><div><b>Live-Verbindung</b><div class="muted" id="connectionText">wird geprüft …</div></div><span class="badge" id="connectionBadge">prüft</span></div>
  <div class="grid">
    <aside class="card"><h2>Bot-Profile</h2><button class="btn primary" id="newProfile">+ Neues Profil</button><div id="profiles"></div></aside>
    <section>
      <div class="card">
        <h2>Profil konfigurieren</h2>
        <div class="fields">
          <div class="field"><label>Name</label><input id="profileName"></div>
          <div class="field"><label>Modus</label><select id="profileMode"><option value="lead">Kampagne / Termin</option><option value="service">Bestandskunden-Service</option><option value="hybrid">Hybrid</option></select></div>
          <div class="field"><label>Kampagne</label><select id="campaignId"><option value="">Keine Kampagne</option></select></div>
          <div class="field"><label>Meta Phone Number ID</label><input id="phoneNumberId" placeholder="für Live-Betrieb"></div>
          <div class="field"><label>Absender / Marke</label><input id="businessName"></div>
          <div class="field"><label>Terminlink</label><input id="appointmentUrl" placeholder="https://..."></div>
          <div class="field full"><label>Ziel des Bots</label><textarea id="objective"></textarea></div>
          <div class="field full"><label>Begrüßung</label><textarea id="welcomeText"></textarea></div>
          <div class="field full"><label>Übergabe an Mensch</label><textarea id="handoffText"></textarea></div>
          <div class="field full"><label>Freigegebene Antworten · eine Zeile pro Eintrag: Frage | Antwort</label><textarea id="answers"></textarea></div>
          <label class="check"><input type="checkbox" id="enabled"><span>Profil live aktiv</span></label>
          <label class="check"><input type="checkbox" id="requireCustomerMatch" checked><span>Kundenzuordnung vor Vertragsdetails</span></label>
        </div>
        <div class="actions"><button class="btn primary" id="saveProfile">Speichern</button><button class="btn danger" id="deleteProfile">Profil löschen</button><span class="muted" id="saveState"></span></div>
      </div>
      <div class="card test">
        <h2>Testchat <span class="badge">sendet nichts an WhatsApp</span></h2>
        <div class="fields"><div class="field"><label>Test-Telefonnummer</label><input id="testSender" value="491700000000"></div><div class="field"><label>Nachricht</label><input id="testMessage" placeholder="z. B. Ist ein Fahrraddiebstahl abgedeckt?"></div></div>
        <div class="actions"><button class="btn primary" id="sendTest">Antwort testen</button></div><div id="chat"></div>
      </div>
      <div class="card test"><h2>Offene Schadenaufnahmen</h2><div id="claims" class="muted">wird geladen …</div></div>
    </section>
  </div>
</main>
<script src="/whatsapp.js"></script>
</body>
</html>
