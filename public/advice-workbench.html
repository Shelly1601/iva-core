<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVA · Finanzplanung & Versicherungsvergleich</title>
<style>
:root{color-scheme:dark;--bg:#09141f;--panel:#11232f;--line:#2a4350;--text:#edf5f6;--muted:#a8bec7;--accent:#79d9c7;--warn:#ffd49a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}a{color:var(--accent)}header{padding:24px 4vw;border-bottom:1px solid var(--line)}header h1{margin:4px 0;font-size:27px}main{max-width:1300px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:290px 1fr;gap:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}h1,h2,h3,summary,td,button,.button{overflow-wrap:anywhere}.layout>*{min-width:0}.grid>*{min-width:0}button,.button{max-width:100%}label{display:block;color:var(--muted);font-size:13px}input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#091923;padding:10px;margin:5px 0 10px}input[type=checkbox]{width:auto;margin-right:8px}textarea{min-height:80px;resize:vertical}button,.button{display:inline-block;border:1px solid var(--line);background:#183543;border-radius:9px;padding:10px 14px;cursor:pointer;text-decoration:none}button.primary{background:var(--accent);color:#09241e;border:0;font-weight:700}button:hover,.button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.notice{border-left:3px solid var(--warn);padding:12px 16px;background:#302a22;border-radius:8px}.case{display:block;width:100%;text-align:left;margin-top:10px}.metric{padding:14px;background:#102b35;border-radius:10px}.metric strong{display:block;color:var(--accent);font-size:24px}.chart{width:100%;height:190px;display:block;background:#0b1c27;border-radius:10px}h2{font-size:21px;margin-top:0}h3{font-size:16px}details{border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}summary{cursor:pointer;font-weight:650}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.status{font-size:13px;padding:8px 0}.actions{position:sticky;bottom:0;background:#09141fed;padding:14px 0;display:flex;gap:10px;z-index:2}pre{white-space:pre-wrap;max-height:280px;overflow:auto;font:13px/1.5 system-ui,sans-serif}.wide{grid-column:1/-1}.danger{color:var(--warn)}@media(max-width:800px){.layout,.grid{grid-template-columns:1fr}main{padding:15px}.actions{flex-wrap:wrap}header h1{font-size:23px}}
</style></head><body><header><a href="/advice">← Beratung</a><h1>Finanzplanung & Versicherungsvergleich</h1><p class="muted">Rechnen, Originalunterlagen prüfen und Entscheidungen nachvollziehbar vorbereiten.</p></header><main>
<div id="message" class="status" role="status" aria-live="polite"></div><div class="layout"><aside>
<section class="card"><h2>Projekt & Kunde</h2><label>Projekt<select id="project"></select></label><label>Kunde<select id="customer"></select></label><label>Neue Beratung<select id="kind"><option value="finance">Finanzplanung</option><option value="insurance">Versicherungsvergleich</option></select></label><label id="categoryLabel" hidden>Sparte<select id="category"><option value="sach">Sach</option><option value="kv">Krankenversicherung</option><option value="lv">Leben / Vorsorge</option><option value="kfz">Kfz</option></select></label><label>Titel<input id="newTitle" placeholder="z. B. Vorsorgeplanung"></label><button id="create" class="primary">Beratung anlegen</button></section>
<section class="card"><h2>Beratungsakten</h2><div id="cases"></div></section><section class="card"><h2>Anbindungen</h2><div id="providers"></div></section></aside>
<section><div id="editor" class="card"><h2>Beratung auswählen</h2><p class="muted">Wählen Sie Projekt und Kunden und legen Sie eine Beratung an.</p></div><div id="result"></div><div id="actions" class="actions" hidden><button id="save" class="primary">Speichern & auswerten</button><button id="pdf">Kunden-PDF</button><button id="reload">Neu laden</button></div></section></div>
</main><script type="module" src="/advice-workbench.js"></script></body></html>
