<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f">
<title>IVA · Terminbuchung</title>
<style>
:root{--bg:#060b15;--panel:#0e1a31;--panel2:#111f39;--line:rgba(118,154,218,.22);--text:#eef4ff;--muted:#8ea3c3;--cyan:#22e6d6;--blue:#579cff;--green:#68dfa8;--yellow:#ffc970;--red:#ff8585}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 540px at 100% 0,rgba(34,230,214,.09),transparent 65%),var(--bg)}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:26px 22px 90px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;color:var(--cyan);font-size:11px;font-weight:800}.top h1{font-size:31px;margin:3px 0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,input,select,textarea{border:1px solid var(--line);border-radius:11px;background:rgba(3,8,18,.72);color:var(--text);padding:10px 12px;outline:none}.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn:hover{border-color:var(--cyan)}.btn.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#05121c;font-weight:800}.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:15px}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(17,31,57,.93),rgba(12,23,43,.93));border-radius:18px;padding:18px}.card h2{font-size:16px;margin:0 0 13px}.status{padding:13px;border-radius:13px;border:1px solid rgba(255,201,112,.32);background:rgba(255,201,112,.055);margin-bottom:14px}.status.ready{border-color:rgba(104,223,168,.35);background:rgba(104,223,168,.05)}.status b,.status small{display:block}.status small{color:var(--muted);margin-top:4px}.list{display:grid;gap:8px}.type{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(3,8,18,.4);color:var(--text);cursor:pointer}.type.active,.type:hover{border-color:var(--cyan);background:rgba(34,230,214,.055)}.type b,.type small{display:block}.type small{color:var(--muted);margin-top:3px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:100px;resize:vertical}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(3,8,18,.35)}.day b{display:block;font-size:11px;margin-bottom:7px}.day input{width:100%;padding:7px;font-size:11px;margin-top:5px}.footer-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}.linkbox{margin-top:14px;padding:12px;border:1px solid rgba(34,230,214,.23);border-radius:12px;background:rgba(34,230,214,.04)}.linkbox b,.linkbox code{display:block}.linkbox code{color:#bdfbf4;overflow-wrap:anywhere;margin:6px 0}.notice{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;padding:11px 13px}.notice.error{border-color:rgba(255,133,133,.35);color:#ffc3c3}.notice.success{border-color:rgba(104,223,168,.35);color:#bdf4d5}.iva{position:fixed;right:18px;bottom:18px;width:64px;height:68px;border:1px solid rgba(34,230,214,.36);border-radius:22px;background:linear-gradient(160deg,#142642,#0a162c);box-shadow:0 12px 34px rgba(0,0,0,.45),0 0 24px rgba(34,230,214,.12);display:grid;place-items:center;color:var(--cyan);font-weight:900;font-size:11px}.iva:before{content:'•  •';display:block;border-radius:10px;padding:7px 10px;background:#050b16;letter-spacing:6px}@media(max-width:800px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.week{grid-template-columns:1fr 1fr}.top{display:block}.actions{margin-top:12px}}
</style>
</head>
<body><main class="wrap">
  <div class="top"><div><div class="eyebrow">IVA Workflow</div><h1>Terminbuchung</h1><div class="muted">Eigene Terminlinks als kontrollierter Calendly-Ersatz.</div></div><div class="actions"><a class="btn" href="/cockpit">← Cockpit</a><a class="btn" href="/customers">Kundenakten</a></div></div>
  <div id="notice" class="notice" hidden></div>
  <section id="readiness" class="status"><b>Status wird geprüft …</b></section>
  <div class="grid">
    <aside class="card"><h2>Terminarten</h2><div id="typeList" class="list"><div class="muted">wird geladen …</div></div><button id="newType" class="btn primary" style="width:100%;margin-top:12px">+ Neue Terminart</button></aside>
    <section class="card"><form id="typeForm"><h2 id="formTitle">Neue Terminart</h2><div class="form-grid">
      <div class="field"><label>Name</label><input id="name" required placeholder="Kennenlerngespräch"></div><div class="field"><label>Linkname</label><input id="slug" placeholder="kennenlernen"></div>
      <div class="field"><label>Dauer</label><select id="duration"><option value="30">30 Minuten</option><option value="45">45 Minuten</option><option value="60">60 Minuten</option><option value="90">90 Minuten</option></select></div><div class="field"><label>Ort</label><select id="locationKind"><option value="video">Video</option><option value="phone">Telefon</option><option value="onsite">Vor Ort</option></select></div>
      <div class="field full"><label>Ort / Videohinweis</label><input id="locationDetails" placeholder="Link folgt mit der Bestätigung"></div>
      <div class="field"><label>Mindestvorlauf</label><select id="minNotice"><option value="12">12 Stunden</option><option value="24">24 Stunden</option><option value="48">48 Stunden</option><option value="72">72 Stunden</option></select></div><div class="field"><label>Buchbar im Voraus</label><select id="maxDays"><option value="30">30 Tage</option><option value="60">60 Tage</option><option value="90">90 Tage</option></select></div>
      <div class="field full"><label>Beschreibung</label><textarea id="description" placeholder="Was erwartet den Kunden in diesem Termin?"></textarea></div>
      <div class="field full"><label>Regelmäßige Verfügbarkeit</label><div class="week" id="week"></div></div>
    </div><div id="shareLink" class="linkbox" hidden></div><div class="footer-actions"><label><input id="active" type="checkbox"> Terminlink live schalten</label><button class="btn primary" type="submit">Terminart speichern</button></div></form></section>
  </div>
</main><div class="iva">IVA</div><script src="/scheduling.js?v=20260813-scheduling"></script></body></html>
