<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f3">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Ihr persönlicher Check-up</title>
  <link rel="stylesheet" href="/customer-checkup.css">
  <script src="/customer-checkup.js" defer></script>
</head>
<body>
  <div class="checkup-shell">
    <header class="checkup-header">
      <a class="brand" aria-label="Persönlicher Check-up"><span class="brand-mark" aria-hidden="true">✓</span><span id="projectName">Ihr persönlicher Check-up</span></a>
      <span class="private-label"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="8" width="12" height="9" rx="2"/><path d="M6.5 8V5a3.5 3.5 0 0 1 7 0v3"/></svg>Persönlich & vertraulich</span>
    </header>
    <main id="checkupMain" tabindex="-1" aria-busy="true">
      <div class="loading-state" role="status"><span class="loading-ring" aria-hidden="true"></span><h1>Einen Moment bitte.</h1><p>Ihr persönlicher Check-up wird geladen.</p></div>
    </main>
    <footer class="checkup-footer"><span>Für das, was Ihnen wichtig ist.</span><span>Betreut mit IVA</span></footer>
  </div>
  <noscript>Bitte aktivieren Sie JavaScript, um Ihren persönlichen Check-up auszufüllen.</noscript>
</body>
</html>
