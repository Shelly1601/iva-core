<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>Termin buchen</title><style>
:root{--bg:#060b15;--panel:#0e1a31;--line:rgba(118,154,218,.25);--text:#eef4ff;--muted:#8ea3c3;--cyan:#22e6d6;--blue:#579cff;--green:#68dfa8;--red:#ff8585}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(800px 500px at 100% 0,rgba(34,230,214,.1),transparent 65%),var(--bg)}.card{width:min(760px,100%);border:1px solid var(--line);border-radius:24px;padding:25px;background:linear-gradient(180deg,rgba(17,31,57,.96),rgba(12,23,43,.96));box-shadow:0 30px 80px rgba(0,0,0,.35)}.brand{color:var(--cyan);font-weight:900;letter-spacing:1px}.muted{color:var(--muted)}h1{margin:7px 0 5px;font-size:30px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.slot,input,textarea,.btn{font:inherit;border:1px solid var(--line);border-radius:11px;background:rgba(3,8,18,.72);color:var(--text);padding:10px 12px}.slot{cursor:pointer}.slot.active,.slot:hover{border-color:var(--cyan);background:rgba(34,230,214,.08)}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form input,.form textarea{width:100%}.full{grid-column:1/-1}.btn{cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#05121c;border:0;font-weight:800}.notice{padding:12px;border:1px solid var(--line);border-radius:11px;margin:14px 0}.success{color:#bdf4d5;border-color:rgba(104,223,168,.35)}.error{color:#ffc3c3;border-color:rgba(255,133,133,.35)}@media(max-width:620px){.slots{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
